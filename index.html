<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171715">
  <meta name="description" content="دکتر گنگ — سید علی بهبهانی | میکس و مستر مهدی عسکری | استودیو برندینگ پزشکی کیان">
  <title>دکتر گنگ | استودیو برندینگ پزشکی کیان</title>
  <style>
    :root{color-scheme:dark;--gold:#d6b66c;--gold-bright:#f4d993;--muted:#89877f;--panel:#1c1c1a;--line:rgba(222,190,116,.2)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 18%,#35332d 0%,#222220 34%,#151514 76%);color:#f1eee6;font-family:Tahoma,"Segoe UI",Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px 30px;overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:radial-gradient(#d8c28b 0.55px,transparent .55px);background-size:5px 5px;mask-image:linear-gradient(to bottom,black,transparent 85%)}
    .player{position:relative;width:min(100%,370px);padding:21px 21px 24px;border-radius:34px;background:linear-gradient(145deg,rgba(65,64,59,.72),rgba(20,20,19,.96) 30%,rgba(25,25,23,.98));border:1px solid rgba(255,255,255,.055);box-shadow:0 30px 80px #0009,inset 1px 1px 1px #ffffff12,inset -1px -1px 1px #0009;overflow:hidden}
    .player:before{content:"";position:absolute;inset:0 0 auto;height:230px;background:linear-gradient(130deg,#ffffff08,transparent 52%);pointer-events:none}
    .topbar{position:relative;display:flex;align-items:center;justify-content:space-between;color:#a9a69d;font-size:10px;letter-spacing:1.7px;margin:0 1px 18px;direction:ltr}
    .topbar .brandmark{font-size:9px;letter-spacing:2px;color:#d4c08d;font-weight:700}
    .tiny-btn{border:0;background:transparent;color:#aaa79e;font-size:20px;padding:0 4px;cursor:pointer}
    .art-wrap{position:relative;border-radius:23px;padding:8px;background:linear-gradient(145deg,#35342f,#10100f);box-shadow:0 14px 28px #0008,inset 1px 1px 1px #ffffff0d}
    .cover{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:17px;box-shadow:0 8px 22px #0008}
    .art-glow{position:absolute;inset:9px;border-radius:17px;pointer-events:none;box-shadow:inset 0 0 45px #0006}
    .track-info{text-align:center;padding:21px 3px 0}
    .track-title{font-size:24px;font-weight:800;letter-spacing:.2px;margin:0;color:#f5f0e4}
    .artist{margin-top:8px;font-size:13px;color:#c4bda9}
    .english{font-size:9px;letter-spacing:3px;color:#8e8878;margin-top:8px;direction:ltr}
    .timeline{margin-top:22px;direction:ltr}
    .range{width:100%;height:4px;appearance:none;background:linear-gradient(to right,var(--gold) 0%,var(--gold) 0%,#49463d 0%,#49463d 100%);border-radius:99px;outline:none;cursor:pointer;display:block}
    .range::-webkit-slider-thumb{appearance:none;width:12px;height:12px;border-radius:50%;background:var(--gold-bright);border:2px solid #29271f;box-shadow:0 0 0 3px #d6b66c20}
    .range::-moz-range-thumb{width:9px;height:9px;border-radius:50%;background:var(--gold-bright);border:2px solid #29271f}
    .times{display:flex;justify-content:space-between;font-size:9px;color:#8d897e;margin-top:9px;font-variant-numeric:tabular-nums}
    .control-disc{position:relative;width:218px;height:218px;max-width:78vw;max-height:78vw;margin:23px auto 0;border-radius:50%;background:radial-gradient(circle at 35% 23%,#292926,#191918 62%,#121211 100%);border:1px solid #080808;box-shadow:0 12px 26px #0008,inset 0 1px 1px #ffffff0a,inset 0 -7px 20px #0008;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:48px 1fr 55px;align-items:center;justify-items:center;padding:13px 17px 11px;direction:ltr}
    .control-disc:before{content:"";position:absolute;inset:8px;border-radius:50%;border:1px solid #ffffff08;pointer-events:none}
    .control-disc:after{content:"";position:absolute;width:73px;height:73px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#20201e,#111110);border:1px solid #ffffff08;box-shadow:inset 0 2px 8px #0009;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
    .control{position:relative;z-index:2;border:0;background:transparent;color:#c9c5ba;display:grid;place-items:center;cursor:pointer;padding:8px;transition:transform .18s,color .18s}
    .control:active{transform:scale(.9)}.control:hover{color:var(--gold-bright)}
    .shuffle{grid-column:2;grid-row:1;color:#b6a578}.previous{grid-column:1;grid-row:2}.next{grid-column:3;grid-row:2}.play{grid-column:2;grid-row:3;color:#f1e6c7}
    .play svg{filter:drop-shadow(0 0 6px #d5b66b30)}
    .playing .control-disc{box-shadow:0 12px 26px #0008,0 0 0 1px #d6b66c20,inset 0 1px 1px #ffffff0a,inset 0 -7px 20px #0008}
    .playing .cover{animation:coverbreath 5s ease-in-out infinite alternate}
    .playing .control-disc:before{border-color:#d6b66c30;box-shadow:0 0 16px #d6b66c10}
    @keyframes coverbreath{from{filter:saturate(.92) brightness(.95)}to{filter:saturate(1.08) brightness(1.04)}}
    .signature{position:relative;margin:22px auto 0;padding:13px 12px 12px;width:100%;border:1px solid #b6974f70;border-radius:15px;background:linear-gradient(110deg,#26231c,#191816 52%,#26231c);text-align:center;box-shadow:inset 0 1px #ffffff08,0 8px 20px #0004}
    .signature:before,.signature:after{content:"✦";position:absolute;top:50%;transform:translateY(-50%);color:#d2b56d;font-size:10px}.signature:before{right:11px}.signature:after{left:11px}
    .signature-fa{font-size:13px;font-weight:700;color:#e4cc8e;letter-spacing:.1px;padding:0 15px}
    .signature-en{font-size:8px;color:#9f957a;letter-spacing:2.3px;margin-top:6px;direction:ltr}
    .credits{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:15px;color:#858176;font-size:10px}
    .credits .dot{width:3px;height:3px;border-radius:50%;background:var(--gold)}
    .footer{font-size:8px;letter-spacing:2px;text-align:center;color:#5f5b52;margin-top:15px;direction:ltr}
    .notice{position:fixed;bottom:10px;left:12px;right:12px;text-align:center;font-size:10px;color:#77736a;pointer-events:none}
    @media(min-height:850px){.player{transform:translateY(-4px)}}
    @media(max-width:360px){body{padding:12px}.player{padding:16px;border-radius:28px}.track-title{font-size:21px}.control-disc{width:198px;height:198px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="player" id="player">
    <header class="topbar">
      <button class="tiny-btn" id="backButton" aria-label="شروع دوباره" title="شروع دوباره">‹</button>
      <span class="brandmark">STUDIO KIAN · EXCLUSIVE PLAYER</span>
      <button class="tiny-btn" id="moreButton" aria-label="اطلاعات آهنگ" title="اطلاعات آهنگ">⋮</button>
    </header>
    <div class="art-wrap"><img class="cover" src="cover.png" alt="کاور رسمی دکتر گنگ"><span class="art-glow"></span></div>
    <section class="track-info" aria-label="اطلاعات آهنگ">
      <h1 class="track-title">دکتر گنگ</h1>
      <div class="artist">سید علی بهبهانی</div>
      <div class="english">DOCTOR GANG</div>
    </section>
    <section class="timeline" aria-label="کنترل زمان آهنگ">
      <input class="range" id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="موقعیت پخش">
      <div class="times"><span id="elapsed">0:00</span><span id="duration">3:22</span></div>
    </section>
    <section class="control-disc" aria-label="کنترل‌های پخش">
      <button class="control shuffle" id="shuffle" aria-label="حالت تصادفی" title="حالت تصادفی">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m16 3 4 4-4 4"/><path d="M4 17h2.5c4.8 0 6.2-10 11-10H20"/><path d="m16 13 4 4-4 4"/><path d="M4 7h2.5c1.4 0 2.5 1 3.4 2.4M14 15.6c1-1.4 2-2.6 3.5-2.6H20"/></svg>
      </button>
      <button class="control previous" id="previous" aria-label="از ابتدا پخش کن" title="از ابتدا"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM19 6v12L9 12z"/></svg></button>
      <button class="control next" id="next" aria-label="شروع دوباره آهنگ" title="شروع دوباره"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM5 6v12l10-6z"/></svg></button>
      <button class="control play" id="play" aria-label="پخش آهنگ" title="پخش / توقف">
        <svg id="playIcon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13L19 12z"/></svg>
      </button>
    </section>
    <div class="signature" aria-label="استودیو برندینگ پزشکی کیان">
      <div class="signature-fa">استودیو برندینگ پزشکی کیان</div>
      <div class="signature-en">MEDICAL BRANDING STUDIO</div>
    </div>
    <div class="credits"><span>میکس و مستر: مهدی عسکری</span><span class="dot"></span><span>اهدایی از استودیو کیان</span></div>
    <div class="footer">A KIAN BRANDING STUDIO EXPERIENCE</div>
    <audio id="audio" preload="metadata" src="track.mp3"></audio>
  </main>
  <div class="notice" id="notice" aria-live="polite"></div>
  <script>
    const audio=document.getElementById('audio');
    const player=document.getElementById('player');
    const playButton=document.getElementById('play');
    const playIcon=document.getElementById('playIcon');
    const seek=document.getElementById('seek');
    const elapsed=document.getElementById('elapsed');
    const duration=document.getElementById('duration');
    const shuffle=document.getElementById('shuffle');
    const notice=document.getElementById('notice');
    let seeking=false;
    function fmt(t){if(!Number.isFinite(t))return '0:00';const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+String(s).padStart(2,'0')}
    function setPlayState(on){player.classList.toggle('playing',on);playButton.setAttribute('aria-label',on?'توقف موقت':'پخش آهنگ');playIcon.innerHTML=on?'<path d="M6.5 5h4v14h-4zM13.5 5h4v14h-4z"/>':'<path d="M8 5.5v13L19 12z"/>'}
    async function togglePlay(){try{if(audio.paused){await audio.play();setPlayState(true);notice.textContent=''}else{audio.pause();setPlayState(false)}}catch(e){notice.textContent='برای پخش، یک‌بار روی دکمه پلی بزنید'}}
    playButton.addEventListener('click',togglePlay);
    audio.addEventListener('play',()=>setPlayState(true));audio.addEventListener('pause',()=>setPlayState(false));
    audio.addEventListener('loadedmetadata',()=>{duration.textContent=fmt(audio.duration);seek.max=audio.duration||100});
    audio.addEventListener('timeupdate',()=>{elapsed.textContent=fmt(audio.currentTime);if(!seeking){seek.value=audio.currentTime;const pct=audio.duration?audio.currentTime/audio.duration*100:0;seek.style.background=`linear-gradient(to right,var(--gold) 0%,var(--gold) ${pct}%,#49463d ${pct}%,#49463d 100%)`}});
    seek.addEventListener('input',()=>{seeking=true;elapsed.textContent=fmt(Number(seek.value));const pct=Number(seek.value)/(Number(seek.max)||1)*100;seek.style.background=`linear-gradient(to right,var(--gold) 0%,var(--gold) ${pct}%,#49463d ${pct}%,#49463d 100%)`});
    seek.addEventListener('change',()=>{audio.currentTime=Number(seek.value);seeking=false});
    function restart(){audio.currentTime=0;if(audio.paused)togglePlay()}
    document.getElementById('previous').addEventListener('click',restart);document.getElementById('next').addEventListener('click',restart);document.getElementById('backButton').addEventListener('click',restart);
    shuffle.addEventListener('click',()=>{const on=shuffle.getAttribute('aria-pressed')!=='true';shuffle.setAttribute('aria-pressed',String(on));shuffle.style.color=on?'var(--gold-bright)':'#b6a578';notice.textContent=on?'این صفحه فقط یک آهنگ دارد؛ حالت تصادفی آهنگ دیگری برای انتخاب ندارد':''});
    document.getElementById('moreButton').addEventListener('click',()=>{notice.textContent='دکتر گنگ · سید علی بهبهانی · میکس و مستر مهدی عسکری'});
    audio.addEventListener('ended',()=>setPlayState(false));
  </script>
</body>
</html>
